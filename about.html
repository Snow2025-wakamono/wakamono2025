<style>
/* スライドショー */
.slideshow {
  width: 100%;
  height: 500px;
  overflow: hidden;
  position: relative;
}

.slideshow img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  position: absolute;
  top: 0;
  left: 0;
  opacity: 0;
  transition: opacity 1s ease-in-out; /* フェードアニメーション */
}

.slideshow img.active {
  opacity: 1; /* 表示する画像の透明度を変更 */
}

.slideshow button {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background-color: rgba(0, 0, 0, 0.5);
  color: #fff;
  border: none;
  padding: 10px 20px;
  cursor: pointer;
  font-size: 16px;
}

.slideshow button.prev {
  left: 10px; /* 左端に配置 */
}

.slideshow button.next {
  right: 10px; /* 右端に配置 */
}

.venue{
  display: flex;
    /* 横並びにする */
    gap: 40px;
    /* 要素間の余白 */
    align-items: stretch;
    /* 上揃え */
    flex-wrap: wrap;
    /* 画面が狭いときは折り返す */
    padding: 24px;
}

.venue .group {
    width: 300px;
    flex: 0 0 300px;
    /* 最小300pxで残りは可変 */
    display: flex;
    flex-direction: column;   /* 縦に並べる */
    justify-content: center;  /* 上下中央 */
    align-items: center;      /* 左右中央 */
    text-align: center;       /* テキストも中央寄せ */
    padding: 20px;

    min-height: 350px;        /* ← ★ここで高さを揃える */
    box-sizing: border-box;

}

.venue .group img {
  width: 65%;
  max-width: 280px;
  height: auto;
  padding: 10px;
}


</style>
